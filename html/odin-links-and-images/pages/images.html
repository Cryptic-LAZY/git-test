<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images</title>
  </head>
  <body>
    <h1>IMAGES</h1>
    <p>
      This page covers common image format, but you may also be looking for
      <a href="./links.html" target="_blank" rel="noopener">links</a> and
      <a href="./misc/extras.html" target="_blank" rel="noopener"
        >useful extras</a
      >.
    </p>
    <h2>JPGs</h2>
    <p>JPG images are good for photos.</p>
    <img
      src="../images/mochi.jpg"
      width="75"
      alt="Mochi ball in a bubble with cute face Image"
    />
    <h2>GIFs</h2>
    <p>GIFs are good for animations.</p>
    <img
      src="../images/mochi.gif"
      width="75"
      alt="animation of dancing mochi ball with face"
    />
    <h2>PNGs</h2>
    <p>PNGs are good for diagrams and icons.</p>
    <img src="../images/mochi.png" width="75" alt="mochi ball with face" />
    <h2>SVGs</h2>
    <p>SVGs are <em>amazing</em>. Use them wherever you can.</p>
    <img src="../images/mochi.svg" alt="mochi image" />
  </body>
</html>
