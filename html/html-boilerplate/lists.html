<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List | Practice</title>
</head>

<body>
    <h1>LIST</h1>    
    <h2>Unordered List</h2>
    <p><ul>
        <li>Lorem.</li>
        <li>Lorem, ipsum.</li>
        <li>Lorem.</li>
    </ul></p>
    <h2>Ordered List</h2>
    <p><ol>
        <li>Lorem.</li>
        <li>Lorem, ipsum.</li>
        <li>Lorem.</li>
    </ol></p>
</body>

</html>
